name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: moon version --all

      # The installers expose only "latest", so CI silently moves to a new
      # compiler whenever one is released. That already happened once: moonc
      # 0.10.15 started rewriting `Int` to `Int32` during fmt, so `moon fmt
      # --check` failed on code that was clean under 0.10.14, and the failure
      # looked like a formatting mistake rather than a toolchain jump. Failing
      # loudly on an untested version makes the real cause obvious.
      - name: Verify the toolchain version is one we support
        shell: bash
        run: |
          set -euo pipefail
          reported="$(moon version --all | sed -n 's/.*moonc \(v[^ ]*\).*/\1/p' | head -n1)"
          echo "moonc reports: $reported"
          case "$reported" in
            v0.10.15*) echo "tested toolchain: ok" ;;
            *)
              echo "::error::moonc $reported is not a version this project has been verified against."
              echo "Verified: v0.10.15+943464bfa. Re-verify locally with"
              echo "  moon check --deny-warn --target all && moon test --deny-warn --target all && moon fmt --check"
              echo "then update this guard and the toolchain note in README.md."
              exit 1
              ;;
          esac

      - name: Update registry
        run: moon update

      - name: Check
        run: moon check --deny-warn --target all

      - name: Test
        run: moon test --deny-warn --target all

      - name: Format
        run: moon fmt --check

      - name: Bundle
        run: moon bundle --all

      - name: CLI smoke test
        run: moon run cmd/main -- demo

      - name: Python interoperability
        run: python scripts/interop.py

      # The benchmarks double as an end-to-end exercise of the largest inputs the
      # library claims to handle, so they run in CI as well as on demand. They
      # also print the ratio table the README quotes, which keeps those numbers
      # checkable rather than asserted.
      - name: Benchmarks and ratio table
        run: moon test --release --target native -p lin2077-zeming/moonxz/lib
